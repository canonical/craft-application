name: build-slices
base: ubuntu@26.04
version: "1.0"
summary: test
description: Exercise build-slices.

platforms:
  platform-independent:
    build-on: [amd64]
    build-for: [amd64]

# declare a top-level build slice
build-slices:
  - bash_bins      # for build.sh to work
  - coreutils_bins # for 'cp'

parts:
  my-part:
    plugin: nil

    # declare a part-level build slice
    build-slices:
      - base-files_release-info # for /etc/os-release
    override-build: |
      cp /etc/os-release ${CRAFT_PART_INSTALL}/os-release

    # workaround for https://github.com/canonical/craft-parts/pull/1737
    stage-slices:
      - base-files_copyright
