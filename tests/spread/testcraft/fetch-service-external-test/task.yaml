summary: Testcraft test runners can use an external fetch service session

priority: 100

systems:
  - ubuntu-24.04-64

environment:
  CI: "1"
  CRAFT_VERBOSITY_LEVEL: DEBUG

prepare: |
  . "$PROJECT_PATH/tests/spread/tools.sh"

  fetch_service.setup --log-file "from-testcraft-test.log"

  # Create two sessions: one for the build and one for the tests.
  fetch_service.create_session --session-name "build"
  fetch_service.create_session --session-name "test"

execute: |
  . "$PROJECT_PATH/tests/spread/tools.sh"

  build_url=$(cat build_session_url.txt)

  export CRAFT_USE_EXTERNAL_FETCH_SERVICE=1
  export CRAFT_PROXY_CERT=/var/snap/fetch-service/current/local-ca.crt

  # Configure "testcraft test" to run the build using the external "build"
  # fetch-service session...
  export HTTP_PROXY="${build_url}"
  export http_proxy="${build_url}"
  export HTTPS_PROXY="${build_url}"
  export https_proxy="${build_url}"

  # ... and the test runners to use the "test" fetch-service session
  test_url=$(cat test_session_url.txt)
  export CRAFT_TEST_FETCH_SERVICE_SESSIONS="${test_url}"

  testcraft test --verbosity=debug
  test -f fetch-service-test*.testcraft

  # Tear down both sessions and check that the "hello" package download went through the
  # "test" session"

  # Build
  fetch_service.teardown_session --session-name "build"
  # 'hello' package *is not* on the 'build' session.
  jq -r '(.artifacts[].metadata | select(.name=="hello")).type' build_session_report.json | NOMATCH "application/vnd.debian.binary-package"

  # Test
  fetch_service.teardown_session --session-name "test"
  # 'hello' package *is* on the 'test' session.
  jq -r '(.artifacts[].metadata | select(.name=="hello")).type' test_session_report.json | MATCH "application/vnd.debian.binary-package"

restore: |
  # Because this is running in "CI" mode, the spread runners are the actual host itself;
  # undo the operations that "testcraft test" did to restore the system to its original state.
  unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy
  rm -f /etc/apt/apt.conf.d/99proxy
  rm -f /root/.pip/pip.conf
  rm -f /usr/local/share/ca-certificates/local-ca.crt
  update-ca-certificates
  snap unset system proxy.http proxy.https || true
  lxc config unset core.proxy_http || true
  lxc config unset core.proxy_https || true
  lxc config unset core.proxy_ignore_hosts || true
  rm -f fetch-service-test*.testcraft session.json build_session_url.txt test_session_url.txt build_session_report.json test_session_report.json
  snap remove --purge fetch-service

debug: |
  logfile=/var/snap/fetch-service/current/from-testcraft-test.log
  if [ -f "${logfile}" ]; then
    cat "${logfile}"
  fi
