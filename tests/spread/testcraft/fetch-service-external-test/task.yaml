summary: Testcraft test runners can use an external fetch service session

priority: 100

systems:
  - ubuntu-24.04-64

environment:
  CI: "1"
  CRAFT_VERBOSITY_LEVEL: DEBUG

prepare: |
  # This test runs "testcraft test" with an external session; this "prepare"
  # section installs the fetch-service and creates a session.
  snap install --candidate fetch-service

  fetch_service_auth="testcraft:testcraft"

  snap set fetch-service control.auth=${fetch_service_auth}
  snap set fetch-service control.port=9999
  snap set fetch-service proxy.port=9988
  snap set fetch-service permissive=true
  snap set fetch-service log.file="from-testcraft-test.log"
  snap set fetch-service upstream-proxy.http=${http_proxy:-}
  snap set fetch-service upstream-proxy.https=${https_proxy:-}
  snap set fetch-service upstream-proxy.no-proxy=${no_proxy:-}

  snap start fetch-service

  sleep 5
  curl -f http://localhost:9999/status

  curl -f --user "$fetch_service_auth" -X POST -d '{"policy": "permissive"}' http://localhost:9999/session --output session.json
  session_id=$(jq -r .id session.json)
  token=$(jq -r .token session.json)
  host_ip=$(ip -f inet addr show lxdbr0 | sed -En -e 's/.*inet ([0-9.]+).*/\1/p')
  echo "http://${session_id}:${token}@${host_ip}:9988" > session_proxy_url.txt

execute: |
  proxy_url=$(cat session_proxy_url.txt)

  testcraft pack

  # Configure "testcraft test" to set up the spread runners to use the external
  # fetch-service session.
  export CRAFT_USE_EXTERNAL_FETCH_SERVICE_FOR_TEST=1
  export CRAFT_PROXY_CERT=/var/snap/fetch-service/current/local-ca.crt
  export HTTP_PROXY="$proxy_url"
  export http_proxy="$proxy_url"
  export HTTPS_PROXY="$proxy_url"
  export https_proxy="$proxy_url"
  # This needs to be set because 'testcraft test' will start up the lxd instance, which
  # will pick up the HTTP_PROXY variables.
  export CRAFT_USE_EXTERNAL_FETCH_SERVICE=1

  testcraft test --verbosity=debug
  test -f fetch-service-test*.testcraft

  # Tear down the and check that the "hello" package download went through the
  # fetch-service
  session_id=$(jq -r .id session.json)
  token=$(jq -r .token session.json)
  fetch_service_auth=$(snap get fetch-service control.auth)
  curl -sf --user "$fetch_service_auth" -X DELETE -d "{\"token\": \"${token}\"}" "http://localhost:9999/session/${session_id}/token"
  curl -sf --user "$fetch_service_auth" "http://localhost:9999/session/${session_id}" | tee session_report.json
  curl -sf --user "$fetch_service_auth" -X DELETE "http://localhost:9999/session/${session_id}"
  curl -sf --user "$fetch_service_auth" -X DELETE "http://localhost:9999/resources/${session_id}"

  jq -r '(.artifacts[].metadata | select(.name=="hello")).type' session_report.json | MATCH "application/vnd.debian.binary-package"

restore: |
  # Because this is running in "CI" mode, the spread runners are the actual host itself;
  # undo the operations that "testcraft test" did to restore the system to its original state.
  unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy
  rm -f /etc/apt/apt.conf.d/99proxy
  rm -f /root/.pip/pip.conf
  rm -f /usr/local/share/ca-certificates/local-ca.crt
  update-ca-certificates
  snap unset system proxy.http proxy.https || true
  lxc config unset core.proxy_http || true
  lxc config unset core.proxy_https || true
  lxc config unset core.proxy_ignore_hosts || true
  rm -f fetch-service-test*.testcraft session.json session_proxy_url.txt session_report.json
  snap remove --purge fetch-service

debug: |
  logfile=/var/snap/fetch-service/current/from-testcraft-test.log
  if [ -f "${logfile}" ]; then
    cat "${logfile}"
  fi
