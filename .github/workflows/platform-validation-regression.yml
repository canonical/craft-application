name: Platform validation regression

on:
  push:
    branches:
      - fix/validate-platforms-before-vectorise
  pull_request:
    paths:
      - craft_application/services/project.py
      - tests/unit/services/test_project.py
      - .github/workflows/platform-validation-regression.yml

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install test dependencies
        run: uv sync --group dev
      - name: Run targeted unit tests
        run: uv run pytest tests/unit/services/test_project.py -q
      - name: Check lint
        run: uvx ruff check craft_application/services/project.py tests/unit/services/test_project.py
      - name: Check formatting
        run: uvx ruff format --check craft_application/services/project.py tests/unit/services/test_project.py
