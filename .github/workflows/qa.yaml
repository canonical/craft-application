name: QA
on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"
  pull_request:
    paths-ignore:
      - ".github/workflows/policy.yaml"
      - ".osv-scanner.toml"

jobs:
  lint:
    uses: canonical/starflow/.github/workflows/lint-python.yaml@main
  test:
    uses: canonical/starflow/.github/workflows/test-python.yaml@main
    with:
      fast-test-platforms: '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm"]'
      fast-test-python-versions: '["3.10", "3.12"]'
      slow-test-platforms: '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm"]'
      slow-test-python-versions: '["3.10", "3.12"]'
      lowest-python-platform: ubuntu-22.04
      lowest-python-version: "3.10"
      use-lxd: true
      pytest-markers: "not flaky and not launchpad"
  test-flaky:
    uses: canonical/starflow/.github/workflows/test-python.yaml@main
    with:
      fast-test-platforms: ""
      slow-test-platforms: '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-24.04-arm"]'
      slow-test-python-versions: '["3.10", "3.12"]'
      lowest-python-platform: ubuntu-22.04
      lowest-python-version: "3.10"
      use-lxd: true
      pytest-markers: "flaky and not launchpad"
  test-launchpad:
    uses: canonical/starflow/.github/workflows/test-python.yaml@main
    with:
      fast-test-platforms: ""
      slow-test-platforms: '["ubuntu-24.04"]'
      slow-test-python-versions: '["3.12"]'
      lowest-python-platform: ""
      lowest-python-version: ""
      use-lxd: false
      pytest-markers: "launchpad"
