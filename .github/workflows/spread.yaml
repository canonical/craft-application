name: Spread
on:
  pull_request:
    paths-ignore:
      - ".github/workflows/policy.yaml"
      - ".osv-scanner.toml"
  merge_group:
  push:
    branches:
      - main
      - hotfix/*
# Cancel existing jobs for this branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  snap-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build snap
        uses: snapcore/action-build@v1
        id: snap
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}

  spread-select:
    runs-on: [self-hosted, spread-enabled]
    outputs:
      systems: ${{ steps.select.outputs.systems }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Find spread systems
        id: select
        run: |
          echo systems=$(spread -list openstack: | cut -d: -f2 | sort | uniq | jq --raw-input . | jq --slurp --compact-output) | tee -a "${GITHUB_OUTPUT}"

  snap-tests:
    name: snap-tests (${{ matrix.system }})
    runs-on: [self-hosted, spread-enabled]
    needs: [snap-build, spread-select]
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.spread-select.outputs.systems) }}

    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests/spread/

      - name: Run spread
        run: |
          spread openstack:${{ matrix.system }}

      - name: Run Ubuntu Pro spread tests
        # The pro suite is restricted to ubuntu-24.04* in spread.yaml
        if: matrix.system == 'ubuntu-24.04-64'
        env:
          UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
        run: |
          if [ -z "$UBUNTU_PRO_TOKEN" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" == "canonical/craft-application" ]; then
              echo "Error: UBUNTU_PRO_TOKEN is not set."
              exit 1
            else
              echo "Warning: UBUNTU_PRO_TOKEN is not set. Skipping Pro tests"
              exit 0
            fi
          fi
          spread openstack:${{ matrix.system }}:tests/spread/pro/

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            pid="$(echo "$r" | grep -o -E '[0-9]+')"
            kill -9 $pid
            spread -discard -reuse-pid=$pid
          done
